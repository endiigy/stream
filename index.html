<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stream</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050506;
        --card: #171a22;
        --ink: #f4f6fb;
        --muted: #9aa1b2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(640px, calc(100% - 32px));
        padding: 32px;
        border-radius: 24px;
        background: var(--card);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        font-weight: 650;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, stream</h1>
      <p>GitHub Pages is serving this app. A podcast player for any feed URL comes next.</p>
    </main>
  </body>
</html>
